<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Panel</title>
  <link rel="stylesheet" href="chat.css" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    :root {
      --bg-1: #09131e;
      --bg-2: #0f1d2d;
      --card: rgba(13, 23, 34, 0.92);
      --card-soft: rgba(18, 31, 42, 0.8);
      --line: rgba(255,255,255,0.08);
      --text: #edf3ff;
      --muted: #9ab0c8;
      --gold: #f8d38a;
      --orange: #ff8a3d;
      --purple: #7c6cf0;
      --green: #62d39d;
      --red: #ff6b6b;
      --shadow: 0 18px 42px rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 108, 240, 0.18), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px;
      margin: 0 auto;
      text-align: center;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
      text-align: left;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.6rem);
      letter-spacing: 0.04em;
    }

    .title-wrap p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(98, 211, 157, 0.12);
      border: 1px solid rgba(98,211,157,0.26);
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.76rem;
    }

    .status-chip::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: block;
      box-shadow: 0 0 12px rgba(98, 211, 157, 0.9);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 20px;
      justify-items: center;
      align-items: stretch;
      max-width: 860px;
      margin: 0 auto;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      min-height: 280px;
      width: 100%;
      max-width: 100%;
      text-align: center;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: rgba(124, 108, 240, 0.9);
      box-shadow: 0 0 0 3px rgba(124, 108, 240, 0.18);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--orange), #ffb36b);
      color: #1a130d;
    }

    .secondary {
      background: linear-gradient(135deg, var(--purple), #a998ff);
      color: white;
    }

    .ghost {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .two-up {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .message.error { color: var(--red); }
    .message.success { color: var(--green); }

    .data-box {
      margin-top: 20px;
      background: var(--card-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }

    .data-box h3 {
      margin: 0 0 12px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .user-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .user-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .role-pill {
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .role-admin { background: rgba(255,107,107,0.12); color: #ff9191; }
    .role-user { background: rgba(98,211,157,0.12); color: #9effbf; }

    @media (max-width: 860px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .two-up {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-chat-page="login">
  <div class="app">
    <div class="brand-lockup" aria-label="DoorVia">
      <span class="brand-mark" aria-hidden="true"></span>
      <span><strong class="brand-name">Door<span>Via</span></strong><small class="brand-kicker">Secure access, simply</small></span>
    </div>
    <div class="topbar">
      <div class="title-wrap">
        <h1>DoorVia</h1>
        <p>Secure access control for your main entry door</p>
      </div>
      <div class="topbar-actions">
        <button class="ghost" type="button" onclick="window.location.href='userlogin.html'">Home</button>
        <div class="status-chip">System Online</div>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>Create User</h2>
        <div class="field">
          <label for="createName">Full Name</label>
          <input id="createName" type="text" placeholder="Enter resident name" />
        </div>
        <div class="two-up">
          <div class="field">
            <label for="createPin">PIN</label>
            <input id="createPin" type="password" maxlength="4" placeholder="4 digits" />
          </div>
          <div class="field">
            <label for="createRole">Access Level</label>
            <select id="createRole">
              <option value="user">Resident</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <button class="primary" type="button" onclick="createUser()">Create User</button>
        <div id="createMessage" class="message" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Login</h2>
        <div class="field">
          <label for="loginName">Name</label>
          <input id="loginName" type="text" placeholder="Resident name" />
        </div>
        <div class="field">
          <label for="loginPin">PIN</label>
          <input id="loginPin" type="password" maxlength="4" placeholder="4 digits" />
        </div>
        <button class="secondary" type="button" onclick="loginUser()">Log In</button>
        <div id="loginMessage" class="message" aria-live="polite"></div>
      </section>

    </div>

    <div class="panel" style="margin-top: 24px;">
      <h2>Admin Access</h2>
      <p style="margin: 0 0 18px; color: var(--muted); line-height: 1.5;">
        Manage pending residents and approve or remove access from the dedicated admin dashboard.
      </p>
      <button class="ghost" type="button" onclick="window.location.href='admin.html'">Open Admin Panel</button>
    </div>

    <div class="data-box">
      <h3>Registered Users</h3>
      <ul id="userList" class="user-list"></ul>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'doorviaUsers';

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (error) {
        return [];
      }
    }

    function saveUsers(users) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
    }

    function setMessage(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'message ' + (type || '');
    }

    function updatePendingUserSelect() {
      const users = getUsers();
      const select = document.getElementById('pendingUserSelect');
      const pending = users.filter(user => user.role !== 'admin' && user.status !== 'approved');

      select.innerHTML = '';

      if (!pending.length) {
        const option = document.createElement('option');
        option.textContent = 'No pending users';
        option.value = '';
        select.appendChild(option);
        return;
      }

      pending.forEach(user => {
        const option = document.createElement('option');
        option.value = user.name;
        option.textContent = `${user.name} (${user.status || 'pending'})`;
        select.appendChild(option);
      });
    }

    function renderUsers() {
      const users = getUsers();
      const list = document.getElementById('userList');
      list.innerHTML = '';

      if (!users.length) {
        list.innerHTML = '<li><span>No users created yet.</span><span class="role-pill role-user">--</span></li>';
        return;
      }

      users.forEach(user => {
        const item = document.createElement('li');
        item.innerHTML = `
          <span>${user.name} ${user.status && user.status !== 'approved' ? `(${user.status})` : ''}</span>
          <span class="role-pill ${user.role === 'admin' ? 'role-admin' : 'role-user'}">${user.role === 'admin' ? 'Admin' : user.status === 'approved' ? 'Approved' : 'Pending'}</span>
        `;
        list.appendChild(item);
      });

      updatePendingUserSelect();
    }

    function createUser() {
      const name = document.getElementById('createName').value.trim();
      const pin = document.getElementById('createPin').value.trim();
      const role = document.getElementById('createRole').value;

      if (!name) {
        setMessage('createMessage', 'Please add a user name.', 'error');
        return;
      }

      if (!/^\d{4}$/.test(pin)) {
        setMessage('createMessage', 'PIN must be exactly 4 digits.', 'error');
        return;
      }

      const users = getUsers();
      const exists = users.some(user => user.name.toLowerCase() === name.toLowerCase());

      if (exists) {
        setMessage('createMessage', 'This user name already exists.', 'error');
        return;
      }

      users.push({ name, pin, role, status: role === 'admin' ? 'approved' : 'pending' });
      saveUsers(users);
      renderUsers();

      document.getElementById('createName').value = '';
      document.getElementById('createPin').value = '';
      document.getElementById('createRole').value = 'user';

      setMessage('createMessage', `${name} was created successfully and is waiting for admin confirmation.`, 'success');
    }

    function loginUser() {
      const name = document.getElementById('loginName').value.trim();
      const pin = document.getElementById('loginPin').value.trim();
      const users = getUsers();
      const match = users.find(user => user.name.toLowerCase() === name.toLowerCase() && user.pin === pin);

      if (!match) {
        setMessage('loginMessage', 'User not found or PIN is incorrect.', 'error');
        return;
      }

      if (match.role !== 'admin' && match.status !== 'approved') {
        setMessage('loginMessage', `${match.name} is waiting for admin confirmation.`, 'error');
        return;
      }

      setMessage('loginMessage', `Welcome ${match.name}. Access approved.`, 'success');
      document.getElementById('loginName').value = '';
      document.getElementById('loginPin').value = '';
      setTimeout(() => {
        window.location.href = 'activities4.html';
      }, 450);
    }

    function adminLogin() {
      const adminName = document.getElementById('adminName').value.trim();
      const adminPin = document.getElementById('adminPin').value.trim();
      const users = getUsers();
      const match = users.find(user => user.role === 'admin' && user.name.toLowerCase() === adminName.toLowerCase() && user.pin === adminPin);

      if (!match) {
        setMessage('adminMessage', 'Admin access denied. Please use an admin account.', 'error');
        return;
      }

      setMessage('adminMessage', `Admin panel unlocked for ${match.name}.`, 'success');
      document.getElementById('adminName').value = '';
      document.getElementById('adminPin').value = '';
      updatePendingUserSelect();
    }

    function confirmUser() {
      const selectedName = document.getElementById('pendingUserSelect').value;
      const users = getUsers();
      const userIndex = users.findIndex(user => user.name.toLowerCase() === selectedName.toLowerCase());

      if (userIndex === -1 || !selectedName) {
        setMessage('adminMessage', 'No user is selected to confirm.', 'error');
        return;
      }

      if (users[userIndex].role === 'admin') {
        setMessage('adminMessage', 'Admin users do not need confirmation.', 'error');
        return;
      }

      users[userIndex].status = 'approved';
      saveUsers(users);
      renderUsers();
      setMessage('adminMessage', `${users[userIndex].name} has been confirmed by admin.`, 'success');
    }

    function deleteUser() {
      const selectedName = document.getElementById('pendingUserSelect').value;
      const users = getUsers();
      const filteredUsers = users.filter(user => user.name.toLowerCase() !== selectedName.toLowerCase());

      if (!selectedName || filteredUsers.length === users.length) {
        setMessage('adminMessage', 'No user is selected to delete.', 'error');
        return;
      }

      saveUsers(filteredUsers);
      renderUsers();
      setMessage('adminMessage', `${selectedName} was deleted successfully.`, 'success');
    }

    renderUsers();
  </script>
  <script src="chat.js"></script>
</body>
</html>
